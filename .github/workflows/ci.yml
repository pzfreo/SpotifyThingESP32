name: PlatformIO CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Cache pip
        uses: actions/cache@v5
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-pio
          restore-keys: ${{ runner.os }}-pip-

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install PlatformIO
        run: pip install platformio

      - name: Run Native Tests
        run: pio test -e native -v

  build:
    runs-on: ubuntu-latest
    needs: test
    strategy:
      matrix:
        device:
          - name: dev1_freenove
            artifact: firmware-dev1-freenove
          - name: m5stack_core
            artifact: firmware-m5stack-core
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Cache pip
        uses: actions/cache@v5
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-pio
          restore-keys: ${{ runner.os }}-pip-

      - name: Cache PlatformIO core
        uses: actions/cache@v5
        with:
          path: |
            ~/.platformio/packages
            ~/.platformio/platforms
            ~/.platformio/penv
            ~/.platformio/.cache
          key: ${{ runner.os }}-pio-core-${{ hashFiles('platformio.ini') }}
          restore-keys: |
            ${{ runner.os }}-pio-core-

      - name: Cache PlatformIO libraries
        uses: actions/cache@v5
        with:
          path: .pio/libdeps
          key: ${{ runner.os }}-pio-libs-${{ matrix.device.name }}-${{ hashFiles('platformio.ini') }}
          restore-keys: |
            ${{ runner.os }}-pio-libs-${{ matrix.device.name }}-

      - name: Cache ccache
        uses: actions/cache@v5
        with:
          path: ~/.ccache
          key: ${{ runner.os }}-ccache-${{ matrix.device.name }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-ccache-${{ matrix.device.name }}-

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install PlatformIO and ccache
        run: |
          pip install platformio
          sudo apt-get install -y ccache
          echo "/usr/lib/ccache" >> $GITHUB_PATH

      - name: Configure ccache
        run: |
          ccache --set-config=cache_dir=~/.ccache
          ccache --set-config=max_size=500M
          ccache --set-config=compression=true
          ccache -z

      - name: Build Firmware (${{ matrix.device.name }})
        env:
          SPOTIFY_AUTH_KEY: ${{ secrets.SPOTIFY_AUTH_KEY }}
          CCACHE_DIR: ~/.ccache
        run: pio run -e ${{ matrix.device.name }}

      - name: Show ccache stats
        run: ccache -s

      - name: Upload Firmware Artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.device.artifact }}
          path: .pio/build/${{ matrix.device.name }}/firmware.bin
          retention-days: 30
