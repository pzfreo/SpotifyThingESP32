; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:freenove_esp32_wrover]
platform = espressif32 @ ^6.5.0
board = freenove_esp32_wrover
framework = arduino
lib_extra_dirs = ~/Documents/Arduino/libraries
monitor_speed = 115200
upload_speed = 460800
lib_deps =
	bblanchon/ArduinoJson@^7.4.2
	lennarthennigs/Button2@^2.5.0
	bitbank2/JPEGDEC@^1.8.4
	tzapu/WiFiManager
	ricmoo/QRCode@^0.0.1
	https://github.com/dejwk/roo_display.git
build_flags =
	-DBOARD_HAS_PSRAM
	-mfix-esp32-psram-cache-issue
    '-D AUTHKEY="${sysenv.SPOTIFY_AUTH_KEY}"'

; Native test environment - runs on host machine (no hardware needed)
[env:native]
platform = native
build_flags =
    -std=c++17
    -DUNIT_TEST
    -DNATIVE_BUILD
lib_deps =
test_framework = unity
test_ignore = test_embedded/*
