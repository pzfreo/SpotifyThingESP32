; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

; ============================================================
; === COMMON SETTINGS ===
; ============================================================
[common]
framework = arduino
monitor_speed = 115200
lib_deps_common =
    bblanchon/ArduinoJson@^7.4.2
    lennarthennigs/Button2@^2.5.0
    tzapu/WiFiManager
    ricmoo/QRCode@^0.0.1
build_flags_common =
    -std=gnu++17
    '-D AUTHKEY="${sysenv.SPOTIFY_AUTH_KEY}"'
build_unflags_common =
    -std=gnu++11

; ============================================================
; === DEV1: Freenove ESP32-WROVER ===
; ============================================================
; Custom build with ILI9488 480x320 display + PSRAM
; Features: Album art, hardware buttons
[env:dev1_freenove]
platform = espressif32 @ ^6.10.0
board = freenove_esp32_wrover
framework = ${common.framework}
lib_extra_dirs = ~/Documents/Arduino/libraries
monitor_speed = ${common.monitor_speed}
upload_speed = 460800
lib_deps =
    ${common.lib_deps_common}
    bitbank2/JPEGDEC@^1.8.4
    https://github.com/dejwk/roo_display.git
lib_ignore = SD
build_flags =
    ${common.build_flags_common}
    -DDEVICE_DEV1_FREENOVE
    -DFEATURE_ALBUM_ART=1
    -DFEATURE_PSRAM=1
    -DBOARD_HAS_PSRAM
    -mfix-esp32-psram-cache-issue
build_unflags =
    ${common.build_unflags_common}
extra_scripts =
    pre:pre_build_patch.py
    ccache_config.py
test_ignore = *

; ============================================================
; === M5Stack Core Basic 2.7 ===
; ============================================================
; Integrated device with ILI9342C 320x240 display
; Features: Built-in buttons, speaker (no PSRAM, no album art)
[env:m5stack_core]
platform = espressif32 @ ^6.10.0
board = m5stack-core-esp32
framework = ${common.framework}
monitor_speed = ${common.monitor_speed}
upload_speed = 460800
lib_deps =
    ${common.lib_deps_common}
    m5stack/M5Stack@^0.4.6
    https://github.com/dejwk/roo_display.git
build_flags =
    ${common.build_flags_common}
    -DDEVICE_M5STACK_CORE
    -DFEATURE_ALBUM_ART=0
    -DFEATURE_PSRAM=0
build_unflags =
    ${common.build_unflags_common}
extra_scripts =
    pre:pre_build_patch.py
    ccache_config.py
test_ignore = *

; ============================================================
; === Native Test Environment ===
; ============================================================
; Runs on host machine (no hardware needed)
[env:native]
platform = native
build_flags =
    -std=c++17
    -DUNIT_TEST
    -DNATIVE_BUILD
lib_deps =
test_framework = unity
test_ignore = test_embedded/*
